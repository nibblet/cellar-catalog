# Bourbon: producers ranked by how much of a US shelf their core ranges are. `site` is the maker's
# own page (the only kind that counts as confirmed). See BOURBON.md.
bourbon:
  - {producer: Buffalo Trace,     site: buffalotracedistillery.com, status: done,  note: "Next.js; one page per bottling under /our-brands/<brand>/<expression>/; proof, named mash bill, class, bottle shot; age only where the label states it; no prices. 68 bottlings, 67 matched/added; Bourbon Cream skipped"}
  - {producer: Beam Suntory,      site: jimbeam.com,                status: done,  note: "one Drupal platform across jimbeam.com, knobcreek.com, makersmark.com, basilhaydenbourbon.com, beamdistilling.com (Baker's, Booker's, Little Book, OGD, Old Overholt, Hardin's Creek, Clermont Steep): schema.org Product + tasting-note PROOF or proof in prose; age only in the product's own copy; Booker's is one page per batch; legentbourbon.com renders client-side only (blocked)"}
  - {producer: Heaven Hill,       site: heavenhilldistillery.com,   status: done,  note: "hand-listed .php pages (the sitemap lists a third); 'Proof: / Age:' block; elijahcraig.com for the aged single barrels and Toasted Barrel; evanwilliams.com has only two real product pages; Parker's Heritage and Heritage Collection pages are the current edition"}
  - {producer: Brown-Forman,      site: oldforester.com,            status: done,  note: "oldforester.com + cooperscraft.com (WordPress; proof in the copy; Birthday Bourbon is one row, the bare-year slug is the current vintage), woodfordreserve.com (Proof note; masters-collection page is the current edition, named by its h1; og:image is seasonal), jackdaniels.com (schema.org Product; lineup from /our-products, /whiskey/premium, /whiskey/bonded-series; flavored and RTD skipped)"}
  - {producer: Wild Turkey,       site: wildturkeybourbon.com,      status: done,  note: "+ russellsreserve.com; PROCESS teaser for proof/age; bottle shots only as sibling thumbs on other product pages; Single Rickhouse page is the current release (h1); American Honey skipped"}
  - {producer: Four Roses,        site: fourrosesbourbon.com,       status: done,  note: "Next.js; '90 Proof / Aged 6 - 7 Years' line; OBSV/OESK… pages fold into Single Barrel, yearly LE Small Batch pages into one row (newest wins); bottle is the second images/bourbons file on the page"}
  - {producer: Barton 1792,       site: 1792bourbon.com,            status: done,  note: "eight static pages (/our-bourbon is Small Batch); flagship proof in the footer, Full Proof's barrel entry proof is the bottling proof, BiB = 100; High Rye and Port Finish state no proof"}
  - {producer: Diageo,            site: bulleit.com,                status: done,  note: "bulleit.com sitemap /whiskeys/* (Contentful; proof from the legal line); georgedickel.com sitemap redirects each whisky to thebar.com, Diageo's own store (canonical link says where it landed; brand/recipes pages are not products); thebar.com brand pages for George Dickel, Blade and Bow, I.W. Harper (bladeandbowwhiskey.com redirects there); I.W. Harper KSB states no proof"}
  - {producer: Lux Row,           site: luxrowdistillers.com,       status: done,  note: "rebelbourbon.com page sitemap + ezrabrooks.com /whiskey/ index (Elementor; h4 name, '50% ALC/VOL / 100 PROOF' line); luxrowdistillers.com brand pages with a tab per variant (Blood Oath, Daviess County, David Nicholson, Lux Row); Daviess proof stated once in prose for all variants, David Nicholson proof only as a named image; flavored, cream and the 2020 French Oak page skipped"}
  - {producer: Michter's,         site: michters.com,               status: done,  note: "/whiskeys/ links one page per whiskey (WPBakery; h2 name, BOTTLING STRENGTH block, bottleimageonorder shot); Legacy Series / Celebration pages stack a block per year, first is current; barrel strength pages give a range (no proof) or an average (taken); Barrel Strength Bourbon and Sour Mash state no proof"}
  - {producer: Angel's Envy,      site: angelsenvy.com,             status: done,  note: "/us/en/our-whiskey/ → collection pages → bottling pages; schema.org Product + prose proof ('Bottled at 117.8 Proof'); Cask Strength and Cellar Collection keep every edition, newest wins; Port Finish and Rye flagships state no proof (listed, not confirmed); Distillery Series and private selection skipped"}
  - {producer: Jefferson's,       site: jeffersonsbourbon.com,      status: blocked, note: "Cloudflare challenge (403 to any non-browser client); read in a browser the product pages (Reserve, Ocean, Ocean Cask Strength, FAQ) state no proof at all, so a capture would confirm nothing; wait for TTB COLA (Phase 2) or the in-app editor"}
  - {producer: Willett,           site: kentuckybourbonwhiskey.com, status: done,  note: "the current home of willettdistillery.com (redirects there); one page per bottling, 'N% by volume | M Proof' line, entry proof ignored; hosts the family's other shelf brands (Rowan's Creek, Noah's Mill, Johnny Drum, Pure Kentucky, Kentucky Vintage, Speakeasy), each its own family; Family Estate blends and Pot Still Reserve Cask Strength state no proof"}
  - {producer: New Riff,          site: newriffdistilling.com,      status: done,  note: "one page per spirit, structured 'Age / Proof: Aged at least N years / M Proof' line; yearly series (Single Malt, Silver Grove Bourbon/Rye, Headliner) keep only the current vintage; single-barrel selection pages state no proof and describe a program, not crawled; gin and New Make skipped"}
  - {producer: Bardstown Bourbon Co, site: bardstownbourbon.com,    status: done,  note: "no product sitemap; /our-products/ links the lineup. Origin Series house line + Distillery Reserve's three permanent named finishes (Cascadia, Cathedral French Oak, Hokkaido Mizunara) + the current Discovery vintage (the first one the /discovery-series/ page lists); the Collaborative Series (Founders KBS, Goose Island, Silver Oak, Amrut, Mars, ~15 more one-off brewery/winery barrel swaps) and single-barrel program pages not crawled"}
  - {producer: Widow Jane,        site: widowjane.com,              status: done,  note: "one page per bottling; 'AGED N YEARS', 'M PROOF N.N% ALC/VOL' tag pills; a bottle finished in a cask that once held another spirit (Tequila Ocho) still reads bourbon once spirit_type keys off class_raw, not the free-text name"}
  - {producer: Peerless,          site: kentuckypeerless.com,       status: blocked, note: "every proof/age/mash figure is baked into label photography (no text anywhere states them, confirmed via the browser pane); section titles ('Small Batch', 'Single Barrel') are canvas-rendered glyphs, not DOM text. Nothing on the site is machine-readable; parked next to Jefferson's"}
  - {producer: Uncle Nearest,     site: unclenearest.com,           status: done,  note: "no product sitemap; proof in prose ('is a 93-proof whiskey', 'bottled at 100 proof'); Master Blend, Single Barrel and Single Barrel Rye state only cask/barrel strength (no number); Uncut/Unfiltered Rye's age is worded 'raised for at least four years'"}
  - {producer: Wilderness Trail, site: wildernesstraildistillery.com, status: blocked, note: "confirmed via the browser pane: none of the three whiskey pages (wheated-bourbon, high-rye-bourbon, rye-whiskey) states a proof, age, or mash percentage anywhere in text — only flavor profile and awards; the 'MASHBILL' accordion is a near-empty placeholder with one generic icon"}
  - {producer: Penelope,          site: shop.penelopebourbon.com,   status: done,  note: "the brand's own Shopify store (not penelopebourbon.com, whose marketing copy rarely states a number); a 'Bourbon Facts'/'Whiskey Facts' block gives Type & Process, Proof, Age, Mash Bill; the Barrel Strength page has a content-entry error (its proof sits in Type & Process, not Proof); five ready-to-pour cocktails on the same store skipped"}
  - {producer: Smoke Wagon,       site: smokewagon.com,             status: done,  note: "smokewagonwhiskey.com is a parked domain, not the maker. A Wix site with almost no numeric data: only Small Batch states a proof (100) anywhere in text; Straight Bourbon and Rye give mash bill and blending prose with no number, Uncut Unfiltered gives a floor ('115-116 plus proof'), not a statement; Silver Dollar is a vodka, skipped. The live Rye page is /copy-of-smoke-wagon-rye — the plain /rye URL the sitemap lists is Wix's own retired draft"}
  - {producer: Old Elk,           site: oldelk.com,                 status: blocked, note: "oldelkdistillery.com redirects here. Confirmed across all 9 whiskey/lineup pages, and in a rendered browser: the site is proud of its 'Slow Cut' proofing process but states no proof number anywhere, and gives a mash bill only for Wheat Whiskey; the 'Core Lineup' and 'Specialty Whiskeys' nav folders are bare category shells with no per-product data in static HTML"}
  - {producer: Barrell,           site: barrellbourbon.com,         status: done,  note: "Wix; every Batch/Gold/Gray/New Year page shows the current release then its full batch history, split at the second 'N proof' mention. Seagrass, Dovetail, Vantage, Armida, Private Release and the Cask Finish Series landing page state no proof/age/mash at all but are still crawled, confirming them still-live rather than wrongly flagging them discontinued; the six one-off Cask Finish Series flavors (Armagnac, P.X. Sherry, Mizunara, ...) each have their own page and, like Bardstown's Collaborative Series, are not crawled individually"}
  - {producer: Starlight,         site: starlightdistillery.com,    status: done,  note: "Huber's Starlight Distillery; WordPress with a custom sd_product post type, sd_product-sitemap.xml is the only reliable product index. Every page ends in an 'Explore More Spirits' carousel of other products' own proof spans, truncated off before reading; a finishing's own name rarely states its class ('Mizunara Reserve'), read instead from the body's opening sentence, which also catches /finishings/orchard-blossom being a Rye despite its Bourbon-finishing URL bucket. 'Aged for a minimum of 4 years' is boilerplate reused verbatim on unrelated bottlings (the Bottled-in-Bond Act's own floor), stripped before reading age. No page states mash bill percentages, only qualitative '3-grain'/'4-grain'"}
  - {producer: Rabbit Hole,       site: rabbitholedistillery.com,   status: done,  note: "The marketing site is the Shopify store itself (no separate shop subdomain); crawled as each product's own .json endpoint. The core four carry a formal SPECS/PROOF/TYPE/SIZE block; Founder's Collection and Distillery Series releases state proof/age inconsistently in prose or not at all (Amburana and Mizunara give an age but no proof, both cask strength). Single-barrel/numbered drops and two entries with a null description state nothing and are not crawled; the store's own product_type field lumps Bespoke Gin and Liddel Vodka in with 'Whiskey'"}
  - {producer: Garrison Brothers, site: garrisonbros.com,           status: done,  note: "garrisonbrothers.com is an unrelated parked domain. Rank Math Product JSON-LD gives a reliable isRelatedTo (Permanent Collection / Limited Release) but a category that's a fixed site-wide default and a Proof value that can lag a year behind an annually-updated page (Cowboy Bourbon); proof read from the body's own line first. Age stated in elliptical two-stage phrasing ('four years ... and four more in ...', 'an additional year') summed by a dedicated function rather than caught by normalize.age()"}
  - {producer: Castle & Key,     site: castleandkey.com,           status: done,  note: "Shopify; the .json API's body_html carries the 'Aged for N years' statement but not proof/mash bill, which live only in the rendered page's Tasting Notes accordion. Mash bill prints in abbreviated codes with no legend (WC/YC=corn, R=rye, W=wheat, MB=malted barley by convention). Two Experimental Series releases name neither bourbon nor rye in their title; read from the description's own 'Our Rye is...' / 'Our Wheated Bourbon is...' opening line"}
  - {producer: Green River,      site: greenriverwhiskey.com,      status: done,  note: "greenriverdistilling.com redirects here. WordPress, no cart. Proof prints as both '(90 proof)' and '[92 PROOF]'. The flagship three state mash bill only in prose (no %) and no age on the product page itself; everything else has a structured Mash Bill block. 'After aging eight years' uses the present participle, not normalize.age()'s 'aged'. Also supplies whiskey as a contract distiller to Bradshaw, Walker's Cay and New England Barrel Company, filed under their own brand families and out of this importer's scope"}
  - {producer: Heaven's Door,    site: heavensdoor.com,            status: done,  note: "Wix; fully rebranded since the seed (Refuge/Revival/Ascension/Revelation over the old plain names), so REFILE keeps the old descriptive expression and aliases the release name. 'Kentucky Bourbon'/'Tennessee Bourbon' both stripped to an empty expression_key() and collided in _dedupe() (same bug class as Barrell's bare 'Bourbon') — renamed to 'KY/TN Straight Bourbon'. 12 other seed rows (Bootleg Series, Decade Series, Exploration Series, ...) are past numbered releases whose pages are live but state no proof in static HTML; left as seed rather than guessed at or marked discontinued"}
  - {producer: Chicken Cock,     site: chickencockwhiskey.com,     status: done,  note: "WordPress; collaboratively distilled at Bardstown Bourbon Company, not self-distilled. A spoofed Chrome UA gets a WAF 403, a plain UA doesn't. Newer core lineup has a clean PROOF:/AGE:/MASHBILL:/CHAR-TOAST: block with spelled-out grain words; several limited releases (Chanticleer, 15/20 Year) predate that layout, state proof only inline, and give no age field — trusted from the product's own slug/name instead. Eight one-off retailer single-barrel picks and a private-cask program page not crawled"}

