# The brand queue behind SCORECARD.md's coverage metric. Tier 1 is what a US humidor is mostly
# made of; Tier 2 is the long tail worth having. `status` is one of: done, next, blocked, todo.
# `site` is the maker's own page (the only kind that counts as confirmed); `note` records what we
# learned about it. Rows come from the catalog's own brand list, ranked by presence.

tier1:
  - {brand: Drew Estate,        site: drewestate.com,     status: done,    note: "43 lines; Liga Privada, Undercrown, Acid, Herrera Esteli, Tabak, KFC, Nica Rustica, Deadwood, Factory Smokes, Isla del Sol filed by brand"}
  - {brand: Oliva,              site: olivacigar.com,     status: done,    note: "16 lines; wrapper by origin only"}
  - {brand: Nub,                site: nubcigar.com,       status: done,    note: "sizes transcribed from images; Cain lives here"}
  - {brand: Hoyo de Monterrey,  site: cigarworld.com,     status: done,    note: "General Cigar; Excalibur filed under Hoyo"}
  - {brand: Punch,              site: cigarworld.com,     status: done,    note: "General Cigar"}
  - {brand: Cohiba,             site: cigarworld.com,     status: done,    note: "General Cigar (US Cohiba)"}
  - {brand: CAO,                site: cigarworld.com,     status: done,    note: "General Cigar; country not stated per line"}
  - {brand: Macanudo,           site: cigarworld.com,     status: done,    note: "General Cigar; Inspirado colours Honduras, classics Dominican, M/Emissary/Mao left null"}
