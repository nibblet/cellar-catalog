  - {brand: Aganorsa Leaf,      site: aganorsaleaf.com,   status: todo}
  - {brand: E.P. Carrillo,      site: epcarrillo.com,     status: todo}
  - {brand: Crowned Heads,      site: crownedheads.com,   status: todo}
  - {brand: Foundation Cigar Co, site: foundationcigarcompany.com, status: todo}
  - {brand: Illusione,          site: illusionecigars.com, status: todo}

