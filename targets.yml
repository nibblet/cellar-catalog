# The brand queue behind SCORECARD.md's coverage metric. Tier 1 is what a US humidor is mostly
# made of; Tier 2 is the long tail worth having. `status` is one of: done, next, blocked, todo.
# `site` is the maker's own page (the only kind that counts as confirmed); `note` records what we
# learned about it. Rows come from the catalog's own brand list, ranked by presence.

tier1:
  - {brand: Drew Estate,        site: drewestate.com,     status: done,    note: "43 lines; Liga Privada, Undercrown, Acid, Herrera Esteli, Tabak, KFC, Nica Rustica, Deadwood, Factory Smokes, Isla del Sol filed by brand"}
  - {brand: Oliva,              site: olivacigar.com,     status: done,    note: "16 lines; wrapper by origin only"}
  - {brand: Nub,                site: nubcigar.com,       status: done,    note: "sizes transcribed from images; Cain lives here"}
  - {brand: Hoyo de Monterrey,  site: cigarworld.com,     status: done,    note: "General Cigar; Excalibur filed under Hoyo"}
  - {brand: Punch,              site: cigarworld.com,     status: done,    note: "General Cigar"}
  - {brand: Cohiba,             site: cigarworld.com,     status: done,    note: "General Cigar (US Cohiba)"}
  - {brand: CAO,                site: cigarworld.com,     status: done,    note: "General Cigar; country not stated per line"}
  - {brand: Macanudo,           site: cigarworld.com,     status: done,    note: "General Cigar; Inspirado colours Honduras, classics Dominican, M/Emissary/Mao left null"}
  - {brand: Partagas,           site: cigarworld.com,     status: done,    note: "General Cigar (US Partagas); all Dominican"}
  - {brand: La Gloria Cubana,   site: cigarworld.com,     status: done,    note: "General Cigar; El Credito (DR) and Estelí lines; one-off Ligas/TAA left null"}
  - {brand: Padron,             site: padron.com,         status: done,    note: "text sizes per series; natural/maduro as separate rows; blend facts from the vertical-integration page"}
  - {brand: Arturo Fuente,      site: arturofuente.com,   status: done,    note: "sizes as text per line; wrapper codes have no legend; binder/filler rarely stated"}
  - {brand: My Father,          site: myfathercigars.com, status: done,  note: "one page per line; covers Don Pepin Garcia, Flor de las Antillas, El Centurion, Jaime Garcia, La Dueña, La Antiguedad, Fonseca, Tabacos Baez; country per page from the maker's copy (USA / Honduras / Nicaragua)"}
  - {brand: Davidoff,           site: us.davidoffgeneva.com, status: done,  note: "BigCommerce data via the store's server action; covers Avo, Camacho, Zino, Zino Platinum; country by approved brand map"}
  - {brand: Camacho,            site: us.davidoffgeneva.com, status: done,  note: "via the Davidoff importer; camachocigars.com could still add leaf names for older lines"}
  - {brand: Rocky Patel,        site: rockypatel.com,     status: done,  note: "one page per line, five size formats; country and body from the site's cigar-category taxonomy; wrapper from page copy on most lines; 8 pages list no sizes"}
  - {brand: Perdomo,            site: perdomocigars.com,  status: done,  note: "Squarespace; nine nav pages with a text section per wrapper; Estate Seleccion, Small Batch, Special Craft, Factory Tour Blend, Nick's Sticks are image galleries only"}
  - {brand: Tatuaje,            site: tatuajecigars.com,  status: done,    note: "legacy static site, no CMS/sitemap; homepage smokes grid gives 19 pages; company catch-all brand covers Cabaiguan, La Riqueza, El Triunfador, Ambos Mundos, La Casita Criolla, Fausto, Havana VI, Seleccion de Cazador alongside core Tatuaje lines; Guapos Natural/Maduro split into two records"}
  - {brand: Ashton,             site: ashtoncigar.com,    status: done,    note: "also La Aroma de Cuba, one shared Drupal 7 template; San Cristobal (sancristobalcigar.com) blocked — 403s the crawler UA, browser UA gets 200"}
  - {brand: Alec Bradley,       site: alecbradley.com,    status: done,    note: "Nuxt 3 + Strapi; each page embeds its product record as JSON, no text-scraping. Fine & Rare's annual releases filed under one line via the page's own parent field. Country unstated site-wide, stays unknown"}
  - {brand: AJ Fernandez,       site: ajfcigars.com,      status: blocked, note: "age gate in front of every page"}
  - {brand: Joya de Nicaragua,  site: joyacigars.com,     status: done,    note: "WordPress; disclosed N/5 strength tiles, plain wrapper/binder/filler; also publishes a parallel /es/ Spanish mirror, skipped. Country curated brand-wide from the homepage's own 'made in Nicaragua...Estelí' statement"}
  - {brand: Montecristo,        site: altadisusa.com,     status: done,    note: "montecristo.com's TLS cert is expired; Altadis USA / Tabacalera USA now lives at altadisusa.com (WordPress, wp-sitemap-posts-cigar_product), scoped to Montecristo + Romeo y Julieta + H. Upmann of its 16 brands; origin stated per page"}
  - {brand: Romeo y Julieta,    site: altadisusa.com,     status: done,    note: "romeoyjulieta.com is a dead frameset; via altadisusa.com alongside Montecristo — see its note"}
  - {brand: H. Upmann,          site: altadisusa.com,     status: done,    note: "via altadisusa.com alongside Montecristo — see its note. The site's wp-sitemap 404'd during this run (individual pages loaded fine); a hardcoded FALLBACK_URLS list in the module covers all three brands' known pages when that happens. 'The Banker' and 'The Banker Daytrader' are two distinct current products sharing a name prefix; the seed's undimensioned 'The Banker / Robusto' matched the Daytrader page's own Robusto size, not the flagship"}
  - {brand: Plasencia,          site: plasenciacigars.com, status: done,    note: "WordPress; one 'collection' page per line (owl-carousel size gallery + spec table + leaf-icon strength meter); the per-size /cigar/ landing pages carry no data at all, only the 9 collection pages matter. The spec table's 'Origin' field is inconsistent — sometimes a country, sometimes a factory name, sometimes a two-country blend joined by '&' — so country is read from it only when it resolves to exactly one known country name"}
  - {brand: Aganorsa Leaf,      site: aganorsaleaf.com,   status: done,    note: "WordPress + Elementor (PowerPack 'Advanced Tabs'); no cigar sitemap, hand-listed from the 'Cigars' nav. Several wrapper variants sit as tabs on one page (Corojo/Maduro/Connecticut/25th...), each its own Blend Summary + size block — the wrapper folds into each size's own name rather than inventing a line. Other conceptual lines split across separate pages instead (JFR Corojo/Maduro/Connecticut; Lunatic Habano/Maduro; the three Guardian of the Farm releases), unified via a small slug table. 'Lunatic' and 'JFR' file under the catalog's existing 'JFR' brand; 'Guardian of the Farm' is a Warped collaboration and files under 'Warped' — the rest of Warped's own catalog still awaits its own warpedcigars.com import. Country stays unknown throughout: the site only says cigars are rolled 'in our factories in Nicaragua and Miami' without saying which per product. One joke entry (Lunatic Maduro's '10 x 100' novelty size) falls outside the schema's ring-gauge range and is skipped; Supreme Leaf reused one size name across two release years at different ring gauges, disambiguated with the ring gauge in parens"}
  - {brand: E.P. Carrillo,      site: epcarrillo.com,     status: done,    note: "epcarrillo.com now redirects to casacarrillocigars.com (a 2025 rebrand to 'Casa Carrillo'). WordPress + WPBakery; no cigar sitemap and no clean product index in the site's own page sitemap — the line list (18 pages) is hand-curated from the site's 'all-products' page plus newer releases not yet listed there (Ascend, Battleborn, La Historia Silk). Sizes are a list of 'Name: L x R'; Tobaccos gives Origin/Wrapper/Binder/Filler each on its own line after the label; Strength is a 'Strength – Word' heading anywhere on the page. A few limited releases state one size under a bare 'Size:' label, sometimes unnamed — kept as its own dimension string. Origin is always 'Dominican Republic', used directly as country. 'Encore Black' (prose only), 'Legacy League' (a loyalty program, not a cigar) and 'Pledge of Allegiance' (data only in prose, one variant unreleased) are skipped"}
  - {brand: Crowned Heads,      site: crownedheads.com,   status: todo}
  - {brand: Foundation Cigar Co, site: foundationcigarcompany.com, status: todo}
  - {brand: Illusione,          site: illusionecigars.com, status: todo}

